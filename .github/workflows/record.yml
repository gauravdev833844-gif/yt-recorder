    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load Cookies (Optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
          fi

      - name: Run Recorder
        env:
          CHANNEL_HANDLE: ${{ matrix.streamer.handle }}
          TARGET_CHANNEL_ID: ${{ matrix.streamer.id }}
          HOURS: "5.5"
          OUT_DIR: "./streams"
          USE_COOKIES: ${{ secrets.YT_COOKIES != '' && 'true' || 'false' }}
          COOKIE_FILE: "cookies.txt"
        run: |
          python3 recorder.py

      - name: Upload Recorded Video & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ matrix.streamer.name }}
          path: |
            ./streams/*.ts
            ./streams/*.log
            ./streams/*.json
          retention-days: 3
