name: Live Recorder

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target:
          - "@anshhhlive_1|UC3NiNPo4kJYnYYhV_6ZnUGw"
          - "@anuragpratap7633|UCMMSseLajKweHbkONabSIDw"
          - "@Apka-aashu|UCGFi8l9sf5ab4hVJf7byBZg"
          - "@arhansid786|UC1IW16v1OZaVccL5lmc7Qgw"
          - "@baskarfiroz15|UCSuA9LrSsE4-GSaSYDUZhNw"
          - "@bekalki|UC-JQRYHht4tLKpiChum6GnA"
          - "@GauravSingh014|UC_lzbwXHhYLhwRqgeFcQMVQ"
          - "@GOREDOXLIVE|UC8MRu8goXUOM-_YaGsUvsmQ"
          - "@HarshxTashu|UCIvzNxn_8Avi35lki-idQHg"
          - "@lvlyhere|UCtcrRSbMONYVCxf7fnOKeDg"
          - "@Roshanecho|UCppBiGQ7ct83q8IcLKSF2vQ"
          - "@rzunscripted08|UCrM7NqiwJt-vZQSutXbWxlQ"
          - "@UziiLive|UCTAROT2c3_EvJCjP8o9R2Yw"
          - "@prankurv123|UCYe2VVWgjUoEEn9LaLSCk9w"
          - "@itsanvro|UC-fYhYPs1OJNAtE9SjEb5Hw"
          - "@rishnaaa4u|UCsda8YnhZU-aabHGLZcCIfw"
          - "@akshunislive|UCLx8eMopf9uo2K84xg1lD5Q"
          - "@BagadBillagang-p6s|UC6_0vYIN2dy3MvBuUSvtZJg"
          - "@aadarshyadav1|UCyUlOENwi_2p_5Hv2fvkQvQ"
          - "@nihaanbhattagainn|UC7fUm_Vc21j2Njra8VUHiaA"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start Recording
        env:
          TARGET_DATA: ${{ matrix.target }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "$YT_COOKIES" > cookies.txt
          export CHANNEL_HANDLE=$(echo "$TARGET_DATA" | cut -d'|' -f1)
          export TARGET_CHANNEL_ID=$(echo "$TARGET_DATA" | cut -d'|' -f2)
          export USE_COOKIES="true"
          export COOKIE_FILE="cookies.txt"
          export HOURS="5.5"
          export OUT_DIR="./streams"
          python3 recorder.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-${{ strategy.job-index }}
          path: ./streams/*
          retention-days: 3
